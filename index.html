<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A two-player Tic Tac Toe game with keyboard controls, round scores, and optional automatic restart.">
  <title>Tic Tac Toe</title><link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script><script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">TWO PLAYERS / ONE BOARD</p><h1>Tic Tac Toe</h1><p class="intro">A little friendly competition. X goes first.</p>
    <dl class="scores" aria-label="Session scores"><div><dt>X wins</dt><dd id="score-x">0</dd></div><div><dt>Draws</dt><dd id="score-draws">0</dd></div><div><dt>O wins</dt><dd id="score-o">0</dd></div></dl>
    <p id="result" role="status" aria-live="polite"></p>
    <div class="board" role="group" aria-label="Tic Tac Toe board">
      <button type="button" class="cell"></button><button type="button" class="cell"></button><button type="button" class="cell"></button>
      <button type="button" class="cell"></button><button type="button" class="cell"></button><button type="button" class="cell"></button>
      <button type="button" class="cell"></button><button type="button" class="cell"></button><button type="button" class="cell"></button>
    </div>
    <button id="restart" type="button">New round</button>
    <label class="auto"><input type="checkbox" id="auto-restart" checked> Start next round automatically</label>
    <p class="hint">Use Tab to choose a square and Enter or Space to play. Turn off automatic restart to keep the result on screen.</p>
    <footer>Made by Vishesh Gupta · Scores last until you reload.</footer>
  </main>
</body>
</html>
